<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 任务台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><span class="eyebrow">AGENT RUNTIME</span><h1>让任务的每一步都有据可查</h1><p>查看执行进度、预算与产物，处理需要你确认的操作。</p></div><span id="connection" role="status">尚未连接</span></header>
<main><section id="login"><h2>连接本地运行时</h2><form id="login-form"><label>访问令牌<input id="token" type="password" autocomplete="off" required placeholder="粘贴启动时提供的访问令牌"></label><button>连接</button></form><p class="muted">令牌仅保留在当前页面内存中，刷新后需重新输入。</p></section>
<div id="workspace" hidden><aside><h2>任务</h2><form id="create-form"><label>新任务<textarea id="task" rows="4" required placeholder="描述任务目标和验收条件"></textarea></label><button>创建任务</button></form><button id="refresh" class="secondary">刷新列表</button><nav id="runs" aria-label="任务列表"></nav></aside>
<article><div id="empty">选择一个任务，查看过程和交付物。</div><div id="detail" hidden><div class="task-heading"><div><span id="status" class="badge"></span><h2 id="task-title"></h2><code id="run-id"></code></div><div><button id="pause" class="secondary">暂停任务</button><button id="resume" class="secondary">恢复任务</button><button id="cancel" class="danger">取消任务</button></div></div>
<div class="metrics"><div><span>已结算</span><strong id="used">—</strong><small>tokens</small></div><div><span>在途预留</span><strong id="reserved">—</strong><small>tokens</small></div><div><span>可用额度</span><strong id="available">—</strong><small>tokens</small></div><div><span>策略阶段</span><strong id="stage">—</strong><small id="metering">—</small></div></div><progress id="budget-bar" max="1" value="0"></progress>
<section><h3>限制原因</h3><p id="policy-mode" class="muted"></p><ul id="policy-reasons"></ul></section><section><h3>需要确认</h3><div id="approvals"></div></section><section><h3>交付物</h3><div id="artifacts"></div></section><section><h3>执行步骤</h3><ol id="steps"></ol></section><section><h3>过程记录</h3><p class="muted">最近 150 条记录，每条最多预览 8,000 字符；完整结果请下载产物。</p><pre id="events" aria-live="polite"></pre></section><p id="outcome"></p></div></article></div><div id="error" role="alert" hidden></div></main><footer>任务状态与预算以运行时的持久化记录为准。</footer></body></html>
